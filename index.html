<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Templates - Vibe Coding Made Easy! 🚀</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
/* Material Design Dark Theme */
:root {
    /* Material Design Dark Theme Colors */
    --md-primary: #2196F3;           /* Primary color */
    --md-primary-variant: #1976D2;   /* Primary variant */
    --md-secondary: #FF9800;         /* Secondary color */
    --md-secondary-variant: #F57C00; /* Secondary variant */
    --md-background: #121212;        /* Background */
    --md-surface: #1E1E1E;           /* Surface */
    --md-error: #CF6679;             /* Error */
    --md-on-primary: #000000;        /* On primary */
    --md-on-secondary: #000000;      /* On secondary */
    --md-on-background: #FFFFFF;     /* On background */
    --md-on-surface: #FFFFFF;        /* On surface */
    --md-on-error: #000000;          /* On error */

    /* Text colors */
    --md-text-primary: #FFFFFF;      /* Primary text */
    --md-text-secondary: #B3B3B3;    /* Secondary text */
    --md-text-hint: #808080;         /* Hint text */

    /* Surface variants */
    --md-surface-variant: #2D2D2D;   /* Card background */
    --md-surface-hover: #333333;     /* Hover surface */

    /* Elevation shadows */
    --md-elevation-01: 0 1px 3px 0 rgba(0, 0, 0, 0.2), 0 1px 1px 0 rgba(0, 0, 0, 0.14), 0 2px 1px -1px rgba(0, 0, 0, 0.12);
    --md-elevation-02: 0 1px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.12);
    --md-elevation-04: 0 2px 4px -1px rgba(0, 0, 0, 0.2), 0 4px 5px 0 rgba(0, 0, 0, 0.14), 0 1px 10px 0 rgba(0, 0, 0, 0.12);
    --md-elevation-06: 0 3px 5px -1px rgba(0, 0, 0, 0.2), 0 6px 10px 0 rgba(0, 0, 0, 0.14), 0 1px 18px 0 rgba(0, 0, 0, 0.12);
    --md-elevation-08: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, 0.12);

    /* Spacing (4dp grid) */
    --md-space-1: 4px;
    --md-space-2: 8px;
    --md-space-3: 12px;
    --md-space-4: 16px;
    --md-space-5: 20px;
    --md-space-6: 24px;
    --md-space-7: 28px;
    --md-space-8: 32px;
    --md-space-9: 36px;
    --md-space-10: 40px;

    /* Border radius */
    --md-radius-xs: 4px;
    --md-radius-sm: 8px;
    --md-radius-md: 12px;
    --md-radius-lg: 16px;
    --md-radius-xl: 28px;

    /* Transitions */
    --md-transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --md-transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --md-transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    /* Legacy support */
    --vscode-bg-primary: var(--md-background);
    --vscode-bg-secondary: var(--md-surface);
    --vscode-bg-tertiary: var(--md-surface-variant);
    --vscode-bg-input: var(--md-surface-variant);
    --vscode-bg-button: var(--md-primary);
    --vscode-bg-hover: var(--md-surface-hover);
    --vscode-border: #333333;
    --vscode-border-focus: var(--md-primary);
    --vscode-text-primary: var(--md-text-primary);
    --vscode-text-secondary: var(--md-text-secondary);
    --vscode-text-muted: var(--md-text-hint);
    --vscode-keyword: var(--md-primary);
    --vscode-string: var(--md-secondary);
    --vscode-comment: var(--md-text-secondary);
    --vscode-number: var(--md-secondary);
    --vscode-function: #FFC107;
    --vscode-success: #4CAF50;
    --vscode-warning: #FF9800;
    --vscode-error: var(--md-error);
    --primary-gradient: linear-gradient(135deg, var(--md-primary) 0%, var(--md-primary-variant) 100%);
    --secondary-gradient: linear-gradient(135deg, var(--md-surface) 0%, var(--md-background) 100%);
    --shadow: var(--md-elevation-02);
    --shadow-hover: var(--md-elevation-04);
    --transition: var(--md-transition);
    --glow: 0 0 10px rgba(187, 134, 252, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto', 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--md-background);
    min-height: 100vh;
    color: var(--md-text-primary);
    transition: var(--md-transition);
    overflow-x: hidden;
    line-height: 1.5;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    margin-top: 10px;
    padding: 15px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 15px 25px;
    background: var(--vscode-bg-secondary);
    border: 1px solid var(--vscode-border);
    border-radius: 6px;
    box-shadow: var(--shadow);
}

.stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.stat-card {
    background: var(--vscode-bg-tertiary);
    border: 1px solid var(--vscode-border);
    padding: 15px;
    border-radius: 6px;
    color: var(--vscode-text-primary);
    flex: 1;
    min-width: 120px;
    text-align: center;
    box-shadow: var(--shadow);
}

.stat-number {
    font-size: 1.8em;
    font-weight: bold;
    display: block;
    color: var(--vscode-function);
}

.stat-label {
    font-size: 0.9em;
    color: var(--vscode-text-secondary);
}

header {
    text-align: center;
    color: var(--md-text-primary);
    margin-bottom: var(--md-space-2);
    padding: var(--md-space-1) 0;
}

h1 {
    font-size: 2.125rem; /* H4 in Material Design */
    font-weight: 400;
    margin-bottom: var(--md-space-2);
    color: var(--md-text-primary);
    letter-spacing: 0.25px;
}

.subtitle {
    font-size: 1rem; /* Body 1 */
    color: var(--md-text-secondary);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.5;
    font-weight: 400;
}

.search-container {
    background: var(--md-surface);
    border-radius: var(--md-radius-md);
    padding: var(--md-space-6);
    margin-bottom: var(--md-space-6);
    box-shadow: var(--md-elevation-01);
    position: relative;
    border: 1px solid var(--md-surface-variant);
}

/* Material Design Filled Text Field */
.search-field {
    position: relative;
    margin-bottom: var(--md-space-4);
}

#searchInput {
    width: 100%;
    padding: var(--md-space-4) var(--md-space-4) var(--md-space-2);
    font-size: 1rem;
    border: none;
    border-bottom: 1px solid var(--md-text-secondary);
    border-radius: var(--md-radius-xs) var(--md-radius-xs) 0 0;
    outline: none;
    transition: var(--md-transition);
    background: var(--md-surface-variant);
    color: var(--md-text-primary);
    font-family: 'Roboto', sans-serif;
    box-sizing: border-box;
}

#searchInput:focus {
    border-bottom-color: var(--md-primary);
    background: var(--md-surface);
}

#searchInput::placeholder {
    color: var(--md-text-hint);
    opacity: 1;
}

.search-field label {
    position: absolute;
    left: var(--md-space-4);
    top: var(--md-space-4);
    color: var(--md-text-secondary);
    transition: var(--md-transition);
    pointer-events: none;
    font-size: 1rem;
}

#searchInput:focus + label,
#searchInput:not(:placeholder-shown) + label {
    top: var(--md-space-1);
    font-size: 0.75rem;
    color: var(--md-primary);
}

#toggleViewBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
}

.quick-actions {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.quick-action-btn {
    background: var(--vscode-bg-button);
    color: white;
    border: 1px solid var(--vscode-border);
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.9em;
    transition: var(--transition);
}

.quick-action-btn:hover {
    background: var(--vscode-bg-hover);
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: var(--md-space-2);
    margin-top: var(--md-space-2);
}

.category-btn {
    background: var(--md-surface-variant);
    border: 1px solid var(--md-surface-variant);
    padding: var(--md-space-2) var(--md-space-4);
    border-radius: var(--md-radius-xl);
    cursor: pointer;
    transition: var(--md-transition);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--md-text-secondary);
    position: relative;
    overflow: hidden;
    box-shadow: var(--md-elevation-01);
}

.category-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: var(--md-transition);
}

.category-btn:hover::before {
    left: 100%;
}

.category-btn:hover {
    background: var(--md-surface-hover);
    box-shadow: var(--md-elevation-02);
    transform: translateY(-1px);
}

.category-btn.active {
    background: var(--md-primary);
    color: var(--md-on-primary);
    border-color: var(--md-primary);
    box-shadow: var(--md-elevation-02);
}

.category-btn.active:hover {
    background: var(--md-primary-variant);
    box-shadow: var(--md-elevation-04);
}

.category-btn-favorites {
    background: #ffd700 !important;
    color: #1e1e1e !important;
}

.prompts-grid.compact-view .prompt-card {
    padding: var(--md-space-3);
    min-height: unset;
}

.prompts-grid.compact-view .prompt-card .prompt-description,
.prompts-grid.compact-view .prompt-card .prompt-template {
    display: none;
}

.prompts-grid.compact-view .prompt-card .prompt-header {
    margin-bottom: var(--md-space-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.prompts-grid.compact-view .prompt-card .prompt-actions {
    margin-top: 0;
}

.collapse-btn {
    background: none;
    border: none;
    color: var(--md-text-secondary);
    cursor: pointer;
    padding: 4px;
    border-radius: 3px;
    transition: var(--transition);
    margin-left: 10px;
}

.collapse-btn:hover {
    color: var(--md-primary);
    background: var(--md-surface-variant);
}

.prompt-card.expanded .prompt-description,
.prompt-card.expanded .prompt-template {
    display: block !important;
}

.prompt-card.collapsed .prompt-description,
.prompt-card.collapsed .prompt-template {
    display: none !important;
}

/* Make collapsed cards have consistent height */
.prompt-card.collapsed {
    min-height: 56px;
    height: 56px;
    max-height: 56px;
    padding: var(--md-space-2) var(--md-space-4);
    display: flex;
    align-items: center;
}

.prompt-card.collapsed .prompt-header {
    width: 100%;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--md-space-4);
    height: 100%;
}

.prompt-card.collapsed .prompt-title {
    margin-bottom: 0;
    display: flex;
    align-items: center;
    gap: var(--md-space-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
}

.prompt-card.collapsed .prompt-actions {
    display: flex;
    align-items: center;
    gap: var(--md-space-2);
    flex-shrink: 0;
    margin-top: 0;
    height: 100%;
}

.prompt-card.collapsed .btn {
    padding: var(--md-space-1) var(--md-space-2);
    font-size: 0.7rem;
    white-space: nowrap;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.prompt-card.collapsed .btn i {
    font-size: 0.85em;
}

.prompt-card.collapsed .collapse-btn {
    padding: var(--md-space-1);
    margin-left: 0;
    height: 28px;
    width: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.prompt-card.expanded {
    min-height: auto;
    height: auto;
    max-height: none;
}

.favorites-title {
    font-size: 1.3em;
    margin-bottom: 15px;
    color: var(--vscode-text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

.favorites-grid {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.favorite-chip {
    background: var(--vscode-function);
    color: var(--vscode-bg-primary);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 0.85em;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    border: 1px solid var(--vscode-border);
}

.favorite-chip:hover {
    background: var(--vscode-bg-hover);
}

.prompts-grid {
    display: flex;
    flex-wrap: wrap;
    gap: var(--md-space-3);
    align-items: start;
}

.prompts-grid .prompt-card {
    flex: 1 1 calc(50% - var(--md-space-3));
    min-width: 300px;
    max-width: 100%;
}

.prompts-grid.compact-view .prompt-card {
    flex: 1 1 calc(50% - var(--md-space-6));
    min-width: 300px;
}

/* Responsive adjustments for larger screens */
@media (min-width: 1920px) {
    .prompts-grid .prompt-card {
        flex: 1 1 calc(33.333% - var(--md-space-6));
        min-width: 350px;
    }
    .prompts-grid.compact-view .prompt-card {
        flex: 1 1 calc(33.333% - var(--md-space-6));
        min-width: 350px;
    }
}

@media (min-width: 2560px) {
    .prompts-grid .prompt-card {
        flex: 1 1 calc(25% - var(--md-space-6));
        min-width: 350px;
    }
    .prompts-grid.compact-view .prompt-card {
        flex: 1 1 calc(25% - var(--md-space-6));
        min-width: 350px;
    }
}

@media (min-width: 3440px) {
    .prompts-grid .prompt-card {
        flex: 1 1 calc(20% - var(--md-space-6));
        min-width: 350px;
    }
    .prompts-grid.compact-view .prompt-card {
        flex: 1 1 calc(20% - var(--md-space-6));
        min-width: 350px;
    }
}

@media (min-width: 3840px) {
    .prompts-grid .prompt-card {
        flex: 1 1 calc(16.666% - var(--md-space-6));
        min-width: 350px;
    }
    .prompts-grid.compact-view .prompt-card {
        flex: 1 1 calc(16.666% - var(--md-space-6));
        min-width: 350px;
    }
}

.prompt-card {
    background: var(--md-surface);
    border-radius: var(--md-radius-md);
    padding: var(--md-space-6);
    box-shadow: var(--md-elevation-01);
    transition: var(--md-transition);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--md-surface-variant);
    display: flex;
    flex-direction: column;
}

.prompt-card:hover {
    box-shadow: var(--md-elevation-04);
    transform: translateY(-2px);
}

.prompt-card.favorite {
    box-shadow: var(--md-elevation-04), 0 0 0 1px rgba(255, 193, 7, 0.5);
    border-color: rgba(255, 193, 7, 0.5);
}

.prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
}

.prompt-title {
    font-size: 1.2em;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--vscode-text-primary);
    flex: 1;
}

.favorite-btn {
    background: none;
    border: none;
    font-size: 1.1em;
    cursor: pointer;
    color: var(--vscode-text-secondary);
    transition: var(--transition);
    padding: 3px;
    border-radius: 3px;
}

.favorite-btn:hover {
    color: var(--vscode-function);
    background: var(--vscode-bg-hover);
}

.favorite-btn.active {
    color: var(--vscode-function);
}

.prompt-description {
    color: var(--vscode-text-secondary);
    margin-bottom: 12px;
    font-size: 0.85em;
    line-height: 1.4;
}

.prompt-template {
    background: var(--vscode-bg-input);
    border: 1px solid var(--vscode-border);
    padding: 10px;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 0.8em;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    border-radius: 3px;
    color: var(--vscode-text-primary);
    position: relative;
    max-height: 16.8em; /* 15 lines * 1.4 line-height * 0.8em font-size */
    overflow-y: auto;
}

.placeholder {
    background: var(--vscode-keyword);
    color: white;
    padding: 1px 4px;
    border-radius: 2px;
    cursor: pointer;
    transition: var(--transition);
    display: inline-block;
    margin: 0 1px;
    font-size: 0.8em;
}

.placeholder:hover {
    background: var(--vscode-bg-hover);
}

.prompt-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: auto;
}

.prompt-header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.btn {
    padding: var(--md-space-3) var(--md-space-5);
    border-radius: var(--md-radius-sm);
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    transition: var(--md-transition);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: var(--md-space-2);
    text-transform: uppercase;
    letter-spacing: 0.0892857143em;
    position: relative;
    overflow: hidden;
    box-shadow: var(--md-elevation-01);
    border: none;
    outline: none;
    font-family: 'Roboto', sans-serif;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: var(--md-transition);
}

.btn:hover::before {
    left: 100%;
}

.btn-primary {
    background: var(--md-primary);
    color: var(--md-on-primary);
    box-shadow: var(--md-elevation-02);
}

.btn-primary:hover {
    background: var(--md-primary-variant);
    box-shadow: var(--md-elevation-04);
    transform: translateY(-1px);
}

.btn-primary:active {
    box-shadow: var(--md-elevation-01);
    transform: translateY(0);
}

.btn-secondary {
    background: transparent;
    color: var(--md-text-secondary);
    border: 1px solid var(--md-surface-variant);
}

.btn-secondary:hover {
    background: var(--md-surface-variant);
    color: var(--md-text-primary);
    box-shadow: var(--md-elevation-02);
    transform: translateY(-1px);
}

.btn-secondary:active {
    box-shadow: var(--md-elevation-01);
    transform: translateY(0);
}

.btn-success {
    background: var(--md-secondary);
    color: var(--md-on-secondary);
    box-shadow: var(--md-elevation-02);
}

.btn-success:hover {
    background: var(--md-secondary-variant);
    box-shadow: var(--md-elevation-04);
    transform: translateY(-1px);
}

.btn-success:active {
    box-shadow: var(--md-elevation-01);
    transform: translateY(0);
}

.feature-proposal {
    background: var(--vscode-bg-secondary);
    color: var(--vscode-text-primary);
    border: 1px solid var(--vscode-border);
    border-radius: 6px;
    padding: 18px;
    margin-top: 20px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
}

.feature-proposal h2 {
    margin-bottom: 12px;
    font-size: 1.6em;
    color: var(--vscode-text-primary);
}

.feature-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.feature-item {
    background: var(--vscode-bg-tertiary);
    border: 1px solid var(--vscode-border);
    padding: 12px;
    border-radius: 3px;
    transition: var(--transition);
}

.feature-item:hover {
    border-color: var(--vscode-border-focus);
    background: var(--vscode-bg-hover);
}

.feature-item h3 {
    margin-bottom: 6px;
    font-size: 1.0em;
    color: var(--vscode-text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
}

.feature-item p {
    font-size: 0.85em;
    color: var(--vscode-text-secondary);
    line-height: 1.4;
}

.toast {
    position: fixed;
    top: var(--md-space-6);
    right: var(--md-space-6);
    background: var(--md-surface);
    color: var(--md-text-primary);
    padding: var(--md-space-4) var(--md-space-6);
    border-radius: var(--md-radius-sm);
    box-shadow: var(--md-elevation-06);
    transform: translateX(400px) scale(0.8);
    transition: var(--md-transition);

/**
 * Utility functions for the AI Prompt Templates
 */

/**
 * Enhanced debounce utility for performance optimization with immediate execution option
 * @param {Function} fn - Function to debounce
 * @param {number} delay - Delay in milliseconds
 * @param {boolean} immediate - Whether to execute immediately
 * @returns {Function} Debounced function
 */
function debounce(fn, delay, immediate = false) {
  let timeout;
  return (...args) => {
    const callNow = immediate && !timeout;
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      timeout = null;
      if (!immediate) fn(...args);
    }, delay);
    if (callNow) fn(...args);
  };
}

/**
 * Throttle utility for performance optimization
 * @param {Function} fn - Function to throttle
 * @param {number} delay - Delay in milliseconds
 * @returns {Function} Throttled function
 */
function throttle(fn, delay) {
  let lastCall = 0;
  return (...args) => {
    const now = new Date().getTime();
    if (now - lastCall < delay) return;
    lastCall = now;
    return fn(...args);
  };
}

/**
 * Fuzzy search implementation
 * @param {string} text - Text to search in
 * @param {string} query - Search query
 * @returns {boolean} Whether the query matches
 */
function fuzzyMatch(text, query) {
  if (!query) return true;
  const textLower = text.toLowerCase();
  const queryLower = query.toLowerCase();

  // Exact match gets highest priority
  if (textLower.includes(queryLower)) return true;

  // Simple fuzzy matching - check if all query characters appear in order
  let queryIndex = 0;
  for (let i = 0; i < textLower.length && queryIndex < queryLower.length; i++) {
    if (textLower[i] === queryLower[queryIndex]) {
      queryIndex++;
    }
  }
  return queryIndex === queryLower.length;
}

/**
 * Highlight search matches
 * @param {string} text - Text to highlight in
 * @param {string} query - Search query
 * @returns {string} Text with highlights
 */
function highlightMatches(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

/**
 * Show toast notification
 * @param {string} message - Message to display
 * @param {string} type - Toast type (success, error, warning, info)
 */
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

/**
 * Fill placeholder in template
 * @param {string} placeholder - Placeholder to fill
 */
function fillPlaceholder(placeholder) {
  const value = prompt(`Enter value for "${placeholder}":`);
  if (value) {
    // Sanitize user input to prevent XSS if used in templates
    const sanitizedValue = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(value) : value;
    // In a real implementation, this would update the template
    showToast(`Placeholder filled: ${sanitizedValue}`, 'success');
  }
}

/**
 * Copy text to clipboard with fallback
 * @param {string} text - Text to copy
 * @param {number} promptId - Prompt ID for usage tracking
 * @param {Function} trackUsage - Usage tracking function
 */
async function copyToClipboard(text, promptId, trackUsage) {
  // Enhanced clipboard handling with better error feedback
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard! 📋', 'success');
      if (promptId && trackUsage) {
        trackUsage(promptId);
      }
    } catch (error) {
      console.warn('Clipboard API failed:', error);
      fallbackCopyToClipboard(text, promptId, trackUsage);
    }
  } else {
    fallbackCopyToClipboard(text, promptId, trackUsage);
  }
}

/**
 * Fallback clipboard copy method
 * @param {string} text - Text to copy
 * @param {number} promptId - Prompt ID for usage tracking
 * @param {Function} trackUsage - Usage tracking function
 */
function fallbackCopyToClipboard(text, promptId, trackUsage) {
  try {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    const successful = document.execCommand('copy');
    document.body.removeChild(textArea);

    if (successful) {
      showToast('Copied to clipboard! 📋', 'success');
      if (promptId && trackUsage) {
        trackUsage(promptId);
      }
    } else {
      throw new Error('execCommand failed');
    }
  } catch (error) {
    console.error('Fallback copy failed:', error);
    showToast('Copy failed. Please select and copy manually.', 'error');
    // Fallback: Select the text in a temporary element for manual copy
    const tempDiv = document.createElement('div');
    tempDiv.textContent = text;
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-999999px';
    tempDiv.style.opacity = '0';
    document.body.appendChild(tempDiv);
    const range = document.createRange();
    range.selectNodeContents(tempDiv);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    showToast('Text selected for manual copy.', 'info');
    setTimeout(() => {
      document.body.removeChild(tempDiv);
      selection.removeAllRanges();
    }, 5000);
  }
}

/**

 */
async function initializeState() {
  loadPrompts();

  try {
    const storedFavorites = localStorage.getItem('clineFavorites');
    AppState.favorites = storedFavorites ? JSON.parse(storedFavorites) : [];
  } catch (error) {
    console.warn('Failed to load favorites from localStorage:', error);
    AppState.favorites = [];
  }

  try {
    const storedStats = localStorage.getItem('clineUsageStats');
    AppState.usageStats = storedStats ? JSON.parse(storedStats) : {};
  } catch (error) {
    console.warn('Failed to load usage stats from localStorage:', error);
    AppState.usageStats = {};
  }

  try {
    const storedCollapseStates = localStorage.getItem('clineCollapseStates');
    AppState.collapseStates = storedCollapseStates ? JSON.parse(storedCollapseStates) : {};
  } catch (error) {
    console.warn('Failed to load collapse states from localStorage:', error);
    AppState.collapseStates = {};
  }

  try {
    const storedViewMode = localStorage.getItem('clineViewMode');
    AppState.isCompactView = storedViewMode ? JSON.parse(storedViewMode) : false;
  } catch (error) {
    console.warn('Failed to load view mode from localStorage:', error);
    AppState.isCompactView = false;
  }
}

/**
 * Save state to localStorage
 */
async function saveToStorage() {
  try {
    localStorage.setItem('clineFavorites', JSON.stringify(AppState.favorites));
    localStorage.setItem('clineUsageStats', JSON.stringify(AppState.usageStats));
    localStorage.setItem('clineCollapseStates', JSON.stringify(AppState.collapseStates));
    localStorage.setItem('clineViewMode', JSON.stringify(AppState.isCompactView));
  } catch (error) {
    console.warn('Failed to save to localStorage:', error);
    showToast('Failed to save preferences', 'error');
  }
}

/**
 * Track usage statistics
 * @param {number} promptId - The prompt ID that was used
 */
function trackUsage(promptId) {
  const today = new Date().toDateString();
  AppState.usageStats[today] = (AppState.usageStats[today] || 0) + 1;
  saveToStorage();
}

/**
 * Toggle favorite status for a prompt
 * @param {number} promptId - The prompt ID to toggle
 */
async function toggleFavorite(promptId) {
  const index = AppState.favorites.indexOf(promptId);
  if (index > -1) {
    AppState.favorites.splice(index, 1);
  } else {
    AppState.favorites.push(promptId);
  }
  await saveToStorage();
  renderPrompts();
}

/**
 * Check if a prompt is favorited
 * @param {number} promptId - The prompt ID to check
 * @returns {boolean} Whether the prompt is favorited
 */
function isFavorite(promptId) {
  return AppState.favorites.includes(promptId);
}

/**
 * Filter prompts based on current search and category filters
 * @param {Array} prompts - Array of prompt objects
 * @returns {Array} Filtered prompts
 */
function filterPrompts(prompts) {
  return prompts.filter(prompt => {
    let matchesCategory = AppState.selectedCategories.has('all') || AppState.selectedCategories.has(prompt.category);

    // Special handling for favorites category
    if (AppState.selectedCategories.has('favorites')) {
      matchesCategory = AppState.selectedCategories.has('favorites') && AppState.favorites.includes(prompt.id);
    }

    const matchesSearch = fuzzyMatch(prompt.title, AppState.searchTerm) ||
                          fuzzyMatch(prompt.description, AppState.searchTerm) ||
                          fuzzyMatch(prompt.template, AppState.searchTerm);
    return matchesCategory && matchesSearch;
  });
}

/**
 * Generate HTML for a single prompt card
 * @param {Object} prompt - Prompt object
 * @returns {string} HTML string for the prompt card
 */
function generatePromptCardHTML(prompt) {
  // Sanitize user inputs
  const safeTitle = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(prompt.title) : prompt.title;
  const safeDescription = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(prompt.description) : prompt.description;
  const safeIcon = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(prompt.icon) : prompt.icon;

  const templateWithPlaceholders = prompt.template.replace(/\[([^\]]+)\]/g, '<span class="placeholder" onclick="fillPlaceholder(\'$1\')">[$1]</span>');
  const highlightedTitle = highlightMatches(safeTitle, AppState.searchTerm);
  const highlightedDescription = highlightMatches(safeDescription, AppState.searchTerm);
  const highlightedTemplate = highlightMatches(templateWithPlaceholders, AppState.searchTerm);
  const isFav = isFavorite(prompt.id);

  // Check if this prompt should be collapsed based on saved state
  const isCollapsed = AppState.collapseStates[prompt.id] !== undefined
    ? AppState.collapseStates[prompt.id]
    : AppState.isCompactView; // Default to view mode setting if no saved state

  if (AppState.isCompactView || isCollapsed) {
    return `
      <div class="prompt-card compact collapsed" data-prompt-id="${prompt.id}">
          <div class="prompt-header">
              <div class="prompt-title">
                  <i class="${prompt.icon}"></i> ${safeTitle}
              </div>
              <div class="prompt-actions">
                  <button class="btn btn-primary copy-btn" data-template="${prompt.template.replace(/"/g, '\"')}" data-prompt-id="${prompt.id}">
                      <i class="fas fa-copy"></i> Copy
                  </button>
                  <button class="btn btn-secondary edit-btn" data-template="${prompt.template.replace(/"/g, '\"')}" data-prompt-id="${prompt.id}">
                      <i class="fas fa-edit"></i> Edit
                  </button>
                  <button class="collapse-btn" data-prompt-id="${prompt.id}" title="Expand to view details">
                      <i class="fas fa-chevron-down"></i>
                  </button>
              </div>
          </div>
          <div class="prompt-description">${prompt.description}</div>
          <div class="prompt-template">${prompt.template}</div>
      </div>
    `;
  }

  // Full view
  return `
    <div class="prompt-card expanded" data-prompt-id="${prompt.id}">
        <div class="prompt-header">
            <div class="prompt-title">
                <i class="${prompt.icon}"></i> ${safeTitle}
            </div>
            <div class="prompt-header-actions">
                <button class="favorite-btn" data-prompt-id="${prompt.id}" title="Add to favorites">
                    <i class="fas fa-star"></i>
                </button>
                <button class="collapse-btn" data-prompt-id="${prompt.id}" title="Collapse to hide details">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
        </div>
        <div class="prompt-description">${highlightedDescription}</div>
        <div class="prompt-template">${highlightedTemplate}</div>
        <div class="prompt-actions">
            <button class="btn btn-primary copy-btn" data-template="${prompt.template.replace(/"/g, '\"')}" data-prompt-id="${prompt.id}">
                <i class="fas fa-copy"></i> Copy
            </button>
            <button class="btn btn-secondary edit-btn" data-template="${prompt.template.replace(/"/g, '\"')}" data-prompt-id="${prompt.id}">
                <i class="fas fa-edit"></i> Edit
            </button>
        </div>
    </div>
  `;
}

/**
 * Set up event listeners for prompt card interactions
 * @param {Element} grid - The grid container element
 */
function setupCardEventListeners(grid) {
  // Handle collapse button clicks
  const collapseButtons = grid.querySelectorAll('.collapse-btn');
  collapseButtons.forEach(button => {
    button.addEventListener('click', function(e) {
      e.stopPropagation();
      const promptId = parseInt(this.dataset.promptId);
      const card = this.closest('.prompt-card');

      if (card.classList.contains('collapsed')) {
        // Expand this specific card
        card.classList.remove('collapsed');
        card.classList.add('expanded');
        this.innerHTML = '<i class="fas fa-chevron-up"></i>';
        this.title = 'Collapse to hide details';
        // Save expanded state (false = not collapsed)
        AppState.collapseStates[promptId] = false;
      } else {
        // Collapse this specific card
        card.classList.remove('expanded');
        card.classList.add('collapsed');
        this.innerHTML = '<i class="fas fa-chevron-down"></i>';
        this.title = 'Expand to view details';
        // Save collapsed state (true = collapsed)
        AppState.collapseStates[promptId] = true;
      }

      // Save to localStorage
      saveToStorage();
    });
  });
  const copyButtons = grid.querySelectorAll('.copy-btn');
  const editButtons = grid.querySelectorAll('.edit-btn');
  const favoriteButtons = grid.querySelectorAll('.favorite-btn');

  copyButtons.forEach(button => {
    button.addEventListener('click', handleCopyClick);
  });

  editButtons.forEach(button => {
    button.addEventListener('click', handleEditClick);
  });

  favoriteButtons.forEach(button => {
    button.addEventListener('click', handleFavoriteClick);
  });
}

/**
 * Handle copy button click events
 * @param {Event} e - Click event
 */
function handleCopyClick(e) {
  const template = e.target.closest('.copy-btn').dataset.template;
  const promptId = parseInt(e.target.closest('.copy-btn').dataset.promptId);

/**
 * Handle edit button click events
 * @param {Event} e - Click event
 */
function handleEditClick(e) {

  const promptId = parseInt(e.target.closest('.edit-btn').dataset.promptId);
  editPrompt(template, promptId);
}

/**
 * Handle favorite button click events
 * @param {Event} e - Click event
 */
async function handleFavoriteClick(e) {
  const promptId = parseInt(e.target.closest('.favorite-btn').dataset.promptId);
  await toggleFavorite(promptId);
  // Re-render to update UI
  renderPrompts();
}

/**
 * Render filtered prompts to the DOM with performance optimizations
 */
function renderPrompts() {
  // Use requestAnimationFrame for better performance
  requestAnimationFrame(() => {
    const grid = document.getElementById('promptsGrid');
    const filteredPrompts = filterPrompts(AppState.prompts);

    // Performance optimization: Use DocumentFragment for batch DOM updates
    const fragment = document.createDocumentFragment();

    filteredPrompts.forEach((prompt, index) => {
      const cardHTML = generatePromptCardHTML(prompt);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(cardHTML, {
        ALLOWED_TAGS: ['div', 'span', 'button', 'i', 'mark'],
        ALLOWED_ATTR: ['class', 'onclick', 'title', 'data-template', 'data-prompt-id', 'aria-label', 'role', 'tabindex'],
      }) : cardHTML;

      const card = tempDiv.firstElementChild;
      if (card) {
        // Add micro-interaction delay
        card.style.animationDelay = `${index * 50}ms`;
        fragment.appendChild(card);
      }
    });

    // Clear existing content and append new content
    grid.innerHTML = '';
    grid.appendChild(fragment);

    // Set up event listeners with passive listeners for better performance
    setupCardEventListeners(grid);

    // Announce to screen readers
    const resultsCount = filteredPrompts.length;
    grid.setAttribute('aria-label', `${resultsCount} prompts found`);
  });
}

/**
 * Edit a prompt template
 * @param {string} template - Current template
 * @param {number} promptId - Prompt ID
 */
function editPrompt(template, promptId) {
  // Store the current prompt ID for saving
  window.currentEditingPromptId = promptId;

  // Populate the modal with the current template
  const textarea = document.getElementById('editPromptTextarea');
  textarea.value = template;

  // Open the edit modal
  openModal('editPromptModal');

  // Focus the textarea for better UX
  setTimeout(() => textarea.focus(), 100);
}

/**
 * Save edited prompt
 */
function saveEditedPrompt() {
  const textarea = document.getElementById('editPromptTextarea');
  const newTemplate = textarea.value.trim();
  const promptId = window.currentEditingPromptId;

  if (!newTemplate) {
    showToast('Template cannot be empty', 'error');
    return;
  }

  // Find and update the prompt in the state
  const prompt = AppState.prompts.find(p => p.id === promptId);
  if (prompt) {
    const oldTemplate = prompt.template;
    if (newTemplate !== oldTemplate) {
      prompt.template = newTemplate;
      showToast('Prompt template updated successfully! ✨', 'success');

      // Re-render the prompts to show the changes
      renderPrompts();
    } else {
      showToast('No changes made to the template', 'info');
    }
  } else {
    showToast('Error: Prompt not found', 'error');
  }

  // Close the modal
  closeModal('editPromptModal');

  // Clear the stored prompt ID
  window.currentEditingPromptId = null;
}

/**
 * Open modal
 * @param {string} modalId - Modal ID to open
 */
function openModal(modalId) {
  document.getElementById(modalId).classList.add('show');
}

/**
 * Close modal
 * @param {string} modalId - Modal ID to close
 */
function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('show');
    // Clear editing state if edit modal was closed
    if (modalId === 'editPromptModal') {
      window.currentEditingPromptId = null;
    }
  }
}

    grid.classList.add('compact-view');
    // Update button icon to match state
    if (toggleBtn) {
      const icon = toggleBtn.querySelector('i');
      if (icon) {
        icon.className = 'fas fa-th-large';
        toggleBtn.title = 'Switch to full view';
      }
    }
  }

  renderPrompts();
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', debounce((e) => {
  AppState.searchTerm = e.target.value;
  renderPrompts();
}, 300));

document.getElementById('categories').addEventListener('click', (e) => {
  if (e.target.classList.contains('category-btn')) {
    const category = e.target.dataset.category;

    if (category === 'all') {
      // "All" category is special - clicking it selects only "all"
      AppState.selectedCategories.clear();
      AppState.selectedCategories.add('all');
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
    } else if (category === 'favorites') {
      // "Favorites" category is special - clicking it selects only "favorites"
      AppState.selectedCategories.clear();
      AppState.selectedCategories.add('favorites');
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
    } else {
      // Multi-select for other categories
      if (AppState.selectedCategories.has('all') || AppState.selectedCategories.has('favorites')) {
        AppState.selectedCategories.clear();
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      }

      if (AppState.selectedCategories.has(category)) {
        AppState.selectedCategories.delete(category);
        e.target.classList.remove('active');
        // If no categories selected, default to "all"
        if (AppState.selectedCategories.size === 0) {
          AppState.selectedCategories.add('all');
          document.querySelector('[data-category="all"]').classList.add('active');
        }
      } else {
        AppState.selectedCategories.add(category);
        e.target.classList.add('active');
      }
    }

    renderPrompts();
  }
});

// Close modals when clicking outside or on close/cancel buttons
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', (e) => {
    // Close if clicking on the overlay background
    if (e.target === modal) {
      modal.classList.remove('show');
      // Clear editing state if edit modal was closed
      if (modal.id === 'editPromptModal') {
        window.currentEditingPromptId = null;
      }
    }
  });
});

// Ensure modal close buttons work properly
document.addEventListener('click', (e) => {
  // Handle modal close button (X)
  if (e.target.classList.contains('modal-close') || e.target.closest('.modal-close')) {
    const modal = e.target.closest('.modal');
    if (modal) {
      closeModal(modal.id);
    }
  }

  // Handle cancel button in edit modal
  if (e.target.classList.contains('btn-secondary') && e.target.textContent.includes('Cancel')) {
    closeModal('editPromptModal');
  }
});

// Keyboard support for modals
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    // Close any open modal
    const openModal = document.querySelector('.modal.show');
    if (openModal) {
      openModal.classList.remove('show');
      // Clear editing state if edit modal was open
      if (openModal.id === 'editPromptModal') {
        window.currentEditingPromptId = null;
      }
    }
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const isCtrlOrCmd = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();

  // Category shortcuts (numbers and letters)
  const categoryShortcuts = {
    '1': 'all', '2': 'cleanup', '3': 'document', '4': 'repair', '5': 'explain',
    '6': 'feature', '7': 'remove', '8': 'refactor', '9': 'generate', '0': 'optimize',
    'q': 'debug', 'w': 'convert', 'e': 'test', 'r': 'security', 't': 'architecture',
    'y': 'review', 'u': 'testing', 'i': 'performance', 'o': 'database', 'p': 'api',
    'a': 'devops', 's': 'analysis', 'd': 'concurrency', 'f': 'prototype', 'g': 'documentation'
  };

  if (categoryShortcuts[key]) {
    e.preventDefault();
    const categoryBtn = document.querySelector(`[data-category="${categoryShortcuts[key]}"]`);
    if (categoryBtn) {
      categoryBtn.click();
      showToast(`Selected ${categoryBtn.textContent.trim()}`, 'success');
    }
    return;
  }

  switch (key) {
  case 'k': {
    if (isCtrlOrCmd) {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
    break;
  }
  case 'f': {
    if (isCtrlOrCmd) {
      e.preventDefault();
      toggleFavoritesView();
    }
    break;
  }
  case 'e': {
    if (isCtrlOrCmd) {
      e.preventDefault();
      // Export functionality removed
    }
    break;
  }
  case 'escape': {
    document.getElementById('searchInput').value = '';
    AppState.searchTerm = '';
    renderPrompts();
    break;
  }
  case 'enter': {
    if (isCtrlOrCmd) {
      e.preventDefault();
      const firstCard = document.querySelector('.prompt-card');
      if (firstCard) {
        const copyBtn = firstCard.querySelector('.btn-primary');
        copyBtn.click();
      }
    }
    break;
  }
  }
});

// Toggle compact view functionality
document.addEventListener('DOMContentLoaded', function() {
  const toggleBtn = document.getElementById('toggleViewBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      const grid = document.getElementById('promptsGrid');
      if (grid) {
        grid.classList.toggle('compact-view');

        // Update AppState
        AppState.isCompactView = grid.classList.contains('compact-view');

        // Save to localStorage
        saveToStorage();

        // Update button icon
        const icon = toggleBtn.querySelector('i');
        if (grid.classList.contains('compact-view')) {
          icon.className = 'fas fa-th-large'; // Grid icon for full view
          toggleBtn.title = 'Switch to full view';
        } else {
          icon.className = 'fas fa-list'; // List icon for compact view
          toggleBtn.title = 'Switch to compact view';
        }
        // Re-render prompts to reflect the new view
        renderPrompts();
      }
    });
  }
});

// Make functions globally available for HTML onclick handlers
window.saveEditedPrompt = saveEditedPrompt;
window.closeModal = closeModal;
window.fillPlaceholder = fillPlaceholder;

// Start the application
initializeApp();
    </script>
</body>
