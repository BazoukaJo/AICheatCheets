<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Assistant - Vibe Coding Made Easy! 🚀</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; clipboard-write 'self'; clipboard-read 'self';">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI Prompt Assistant</h1>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Search prompts... (e.g., 'clean up', 'debug', 'add feature')" autocomplete="off">
            <div class="categories" id="categories">
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="favorites" style="background: #ffd700; color: #1e1e1e;"><i class="fas fa-star"></i> Favorites</button>
                <button class="category-btn" data-category="cleanup">Clean Up</button>
                <button class="category-btn" data-category="document">Document</button>
                <button class="category-btn" data-category="repair">Repair</button>
                <button class="category-btn" data-category="explain">Explain</button>
                <button class="category-btn" data-category="feature">Add Feature</button>
                <button class="category-btn" data-category="remove">Remove</button>
                <button class="category-btn" data-category="refactor">Refactor</button>
                <button class="category-btn" data-category="beautify">Beautify</button>
                <button class="category-btn" data-category="generate">Generate</button>
                <button class="category-btn" data-category="optimize">Optimize</button>
                <button class="category-btn" data-category="debug">Debug</button>
                <button class="category-btn" data-category="convert">Convert</button>
                <button class="category-btn" data-category="test">Test</button>
                <button class="category-btn" data-category="security">Security</button>
                <button class="category-btn" data-category="architecture">Architecture</button>
                <button class="category-btn" data-category="review">Review</button>
                <button class="category-btn" data-category="testing">Testing</button>
                <button class="category-btn" data-category="performance">Performance</button>
                <button class="category-btn" data-category="database">Database</button>
                <button class="category-btn" data-category="api">API</button>
                <button class="category-btn" data-category="devops">DevOps</button>
                <button class="category-btn" data-category="analysis">Analysis</button>
                <button class="category-btn" data-category="concurrency">Concurrency</button>
                <button class="category-btn" data-category="prototype">Prototype</button>
                <button class="category-btn" data-category="documentation">Documentation</button>
            </div>
        </div>

        <div class="prompts-grid" id="promptsGrid">
            <!-- Prompts will be populated by JavaScript -->
        </div>
    </div>

    <!-- Modals -->

    <div class="modal" id="editPromptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Prompt Template</h3>
                <button class="modal-close" onclick="closeModal('editPromptModal')">&times;</button>
            </div>
            <div id="editPromptContent">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Prompt Template:</label>
                    <textarea id="editPromptTextarea" rows="8" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); resize: vertical; font-family: 'JetBrains Mono', monospace;" placeholder="Enter your prompt template..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="closeModal('editPromptModal'); return false;">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button class="btn btn-primary" onclick="saveEditedPrompt(); return false;">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard! 📋</div>

    <script src="app.js"></script>
</body>
</html>
